<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    body {
      width: 260px; min-height: 160px;
      background: #0b1f3a; color: #e8edf5;
      font-family: 'DM Sans', -apple-system, sans-serif;
      font-size: 13px; margin: 0; padding: 16px;
    }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .logo-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, #00c2a8, #0066cc);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-text { font-size: 14px; font-weight: 600; }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,194,168,0.1);
      border: 1px solid rgba(0,194,168,0.25);
      border-radius: 8px; padding: 10px 12px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00c2a8;
      box-shadow: 0 0 6px #00c2a8;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text { font-size: 12px; color: #7a91b3; }
    .status-text b { color: #e8edf5; }
    .info-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #1f3660; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #7a91b3; }
    .info-val { font-weight: 500; }
    .footer { margin-top: 14px; font-size: 11px; color: #7a91b3; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">🛡</div>
    <div class="logo-text">Fraud Interceptor</div>
  </div>
  <div class="status-row">
    <div class="dot"></div>
    <div class="status-text">Protection <b>Active</b></div>
  </div>
  <div class="info-row">
    <span class="info-label">Backend</span>
    <span class="info-val" id="backend-status">Checking...</span>
  </div>
  <div class="info-row">
    <span class="info-label">Block threshold</span>
    <span class="info-val">75%</span>
  </div>
  <div class="info-row">
    <span class="info-label">Verify threshold</span>
    <span class="info-val">50%</span>
  </div>
  <div class="info-row">
    <span class="info-label">History window</span>
    <span class="info-val">Last 5 txns</span>
  </div>
  <div class="footer">Intercepting all payment forms on this page.</div>
  <script>
    fetch('http://127.0.0.1:8000/health')
      .then(r => r.json())
      .then(() => {
        document.getElementById('backend-status').textContent = '✅ Online';
        document.getElementById('backend-status').style.color = '#4ade80';
      })
      .catch(() => {
        document.getElementById('backend-status').textContent = '❌ Offline';
        document.getElementById('backend-status').style.color = '#f87171';
      });
  </script>
</body>
</html>
